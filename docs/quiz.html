<style>
:root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#16a34a; --ok:#16a34a; --bad:#dc2626; --blue:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#131c2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#253349; } }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
.wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
a { color:var(--blue); } h1 { font-size:1.9rem; }
.sub { color:var(--muted); }
.scorebox { position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
.score { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; font-weight:700; }
.qcard { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:14px; padding:18px 20px; margin-top:16px; }
.qcard h3 { font-size:1.02rem; margin-bottom:10px; }
.opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
.opt:hover { border-color:var(--accent); }
.opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--bg)); }
.opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.why { display:none; margin-top:10px; color:var(--muted); font-size:.92rem; border-top:1px dashed var(--line); padding-top:8px; }
.reset { margin-top:20px; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
footer { margin-top:44px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:.88rem; }
</style>

<style id="i18n-css">
#lang-pick{position:fixed;top:10px;right:10px;z-index:9999;font:600 .85rem -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--card,#fff);color:var(--ink,#0f172a);border:1px solid var(--line,#e2e8f0);border-radius:999px;padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}

@media print{#lang-pick{display:none}}
</style></head><body><select aria-label="Language / भाषा" id="lang-pick" onchange="schoolSetLang(this.value)">
<option value="mr">🇮🇳 मराठी</option><option value="en">🇬🇧 English</option></select><div class="wrap">
<p data-en='&lt;a href="index.html"&gt;← Back to the course home&lt;/a&gt;'><a href="index.html">← कोर्सच्या मुख्य पानाकडे परत</a></p>
<h1 data-en="🧪 The 📮 CI/CD quiz">🧪 📮 CI/CD प्रश्नमंजुषा</h1>
<p class="sub" data-en="15 questions — pick an answer, get the why. One attempt per question (until reset).
Your best score is saved in this browser.">15 प्रश्न — उत्तर निवडा, कारण मिळवा. प्रत्येक प्रश्नाला एकच प्रयत्न (reset पर्यंत). तुमचा सर्वोत्तम गुण या ब्राउझरमध्ये जपला जातो.</p>
<div class="scorebox"><div class="score" data-en="0 / 15 · best: —" id="score">0 / 15 · सर्वोत्तम: —</div></div>
<div id="quiz"></div>
<button class="reset" data-en="↺ Reset &amp;amp; retake" onclick="reset()">↺ Reset &amp; पुन्हा द्या</button>
<footer data-en='Part of &lt;a href="https://baluraut.github.io/school/"&gt;🏫 The School&lt;/a&gt; · &lt;a href="index.html"&gt;course home&lt;/a&gt; · &lt;a href="quiz.html"&gt;🧪 quiz&lt;/a&gt; · &lt;a href="study-plan.html"&gt;🗓️ study plan&lt;/a&gt; ·

'><a href="https://baluraut.github.io/school/">🏫 द स्कूल</a> चा भाग · <a href="index.html">कोर्स होम</a> · <a href="quiz.html">🧪 प्रश्नमंजुषा</a> · <a href="study-plan.html">🗓️ अभ्यास योजना</a> · <a href="https://github.com/BaluRaut/learn-cicd-school/issues">🐛 चूक सापडली?</a></footer>
</div>
<script>
var QS = [{"q": "CI vs continuous delivery vs continuous deployment?", "o": ["Three names for the same thing", "Integrate + check on every push · always releasable (a human presses the button) · every green change goes live automatically", "CI is for developers, CD is for operations"], "c": 1, "w": "L01: the mailroom checks every submission; delivery keeps a button; deployment removes the button."}, {"q": "Which one is the RUNNER?", "o": ["The YAML file", "The machine that executes a job's steps", "The git branch being built"], "c": 1, "w": "L02: desks (jobs) need clerks (runners)."}, {"q": "You push to a feature branch. Which ship.yml jobs run?", "o": ["All of them", "None — ship.yml listens only to pushes on main; ci.yml is what runs on every branch", "Only the deploy job"], "c": 1, "w": "L03/L07: `on: push: branches: [main]` — the photocopier only copies homework that reached main."}, {"q": "You change one space character in app/prepare.js. The next run's cache is a…", "o": ["Hit — whitespace doesn't count", "Miss — the key is hashFiles('app/prepare.js') and the bytes changed", "Hit, but slower"], "c": 1, "w": "L04: the key IS the hash of the file's bytes; a new key means an empty drawer."}, {"q": "Artifact vs cache?", "o": ["The same mechanism with two names", "Artifact = an output of this run kept for humans or later jobs; cache = a speed-up that may vanish", "Caches are for tests, artifacts are for images"], "c": 1, "w": "L05: the envelope vs the drawer."}, {"q": "Why does the push job download image.tar.gz instead of reusing the image the build job made?", "o": ["Docker requires it", "Each job runs on a fresh machine — nothing from job A exists in job B unless it travels as an artifact", "To slow the run down on purpose"], "c": 1, "w": "L05: desks don't share drawers."}, {"q": "OIDC in ship.yml means…", "o": ["AWS keys are stored as GitHub secrets", "No stored keys: the run presents a signed badge and AWS STS hands out temporary credentials for that one job", "The runner is hosted inside AWS"], "c": 1, "w": "L06: the badge and the day pass — the AWS school's robots never get passwords either."}, {"q": "The image tag pushed to ECR is…", "o": ["latest", "the full commit SHA", "the branch name"], "c": 1, "w": "L07: immutable and traceable — the box is labeled with the homework's fingerprint."}, {"q": "What makes the production job wait for a human?", "o": ["A sleep step", "The `environment: production` key plus required reviewers configured on that environment", "A comment in the YAML"], "c": 1, "w": "L08: the principal's signature lives in Settings → Environments, not in the file."}, {"q": "maxSurge: 1, maxUnavailable: 0 with a readiness probe means…", "o": ["All pods restart at once", "One new pod comes up and must answer /healthz before an old one is removed", "Zero downtime is impossible"], "c": 1, "w": "L09: replace the pins one at a time; the probe is the 'readable?' check."}, {"q": "The safest default rollback?", "o": ["SSH to the node and edit the container", "Re-run the deploy with yesterday's image tag", "Delete the namespace and start over"], "c": 1, "w": "L09: the tag is the version and the pipeline is the paved road; `rollout undo` is the emergency lever."}, {"q": "After a push-model deploy finishes…", "o": ["The pipeline keeps watching the cluster", "Nothing watches the board — hand edits drift silently (the ArgoCD school's opening problem)", "Kubernetes reports back to CI"], "c": 1, "w": "L10: push ends at apply; GitOps pulls forever."}, {"q": "CircleCI `type: approval`, GitLab `when: manual`, Jenkins `input` are all…", "o": ["Ways to run tests in parallel", "The manual approval gate in that dialect", "Cache settings"], "c": 1, "w": "L11: four courier companies, same route, different forms."}, {"q": "A test fails about once in twenty runs. You should…", "o": ["Add retries and move on", "Quarantine it, fix the cause, then bring it back — retries hide rot", "Delete the test"], "c": 1, "w": "L12: a flaky test destroys trust in the green check, which is the whole product."}, {"q": "Pinning `uses: actions/checkout@<full commit SHA>` protects against…", "o": ["Slow checkouts", "A tag being moved to different code later (supply chain)", "Nothing — tags can't change"], "c": 1, "w": "L12: tags can move; a SHA cannot."}];
var KEY='quiz-cicd-school', answered={}, score=0;
var best = parseInt(localStorage.getItem(KEY)||'-1');
function render() {
  var el = document.getElementById('quiz'); el.innerHTML='';
  QS.forEach(function(q,i) {
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<h3>'+(i+1)+'. '+q.q+'</h3>';
    q.o.forEach(function(opt,j) {
      var b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=function() {
        if (answered[i]!==undefined) return;
        answered[i]=j;
        if (j===q.c) { b.classList.add('right'); score++; }
        else { b.classList.add('wrong'); card.querySelectorAll('.opt')[q.c].classList.add('right'); }
        card.querySelector('.why').style.display='block';
        update();
      };
      card.appendChild(b);
    });
    var why=document.createElement('div'); why.className='why'; why.textContent='💡 '+q.w;
    card.appendChild(why);
    el.appendChild(card);
  });
}
function update() {
  var done=Object.keys(answered).length;
  if (done===QS.length && score>best) { best=score; localStorage.setItem(KEY,best); }
  document.getElementById('score').textContent=score+' / '+QS.length+(done===QS.length?' — done! 🎓':'')+' · best: '+(best<0?'—':best+'/'+QS.length);
}
function reset() { answered={}; score=0; render(); update(); }
render(); update();
</script>

<script id="i18n-js">
function schoolSetLang(l){
  try{localStorage.setItem('school-lang',l)}catch(e){}
  document.documentElement.setAttribute('lang',l);
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(!el.hasAttribute('data-mr')) el.setAttribute('data-mr', el.innerHTML);
    el.innerHTML = (l==='en') ? el.getAttribute('data-en') : el.getAttribute('data-mr');
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    if(!el.hasAttribute('data-mr-ph')) el.setAttribute('data-mr-ph', el.getAttribute('placeholder'));
    el.setAttribute('placeholder', (l==='en') ? el.getAttribute('data-en-ph') : el.getAttribute('data-mr-ph'));
  });
  var p=document.getElementById('lang-pick'); if(p) p.value=l;
}
(function(){ var l='mr'; try{ l=localStorage.getItem('school-lang')||'mr'; }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){schoolSetLang(l)}); else schoolSetLang(l); })();
</script></body></html>
